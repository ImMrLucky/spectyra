[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "spectyra"
version = "0.1.0"
description = "Spectyra SDK for Python backends — local runtime HTTP + optional native FFI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Spectyra" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "fastapi>=0.100", "flask>=3.0", "httpx>=0.27", "requests>=2.31", "aiohttp>=3.9"]

[tool.setuptools.packages.find]
where = ["src"]
